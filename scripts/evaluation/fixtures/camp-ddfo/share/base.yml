include: resource:/includes/std-auth.yml

name: camp-dd-fo
inet: 10.10.9.0/24

images:
  client:
    ref: python:3.12.0
  auth:
    ref: bind:9.18.4
  unbound:
    ref: unbound:1.22.0

vars:
  primary: example.com
  secondary: attacker.com
  aux: none.none

builds:
  client:
    image: client
    command: tail -f /dev/null
    environment:
      R: ${srv.unbound.ip}
    volumes:
      - resource/poc_trigger.py:/usr/local/dump/poc_trigger.py:ro
  unbound:
    image: unbound
    volumes:
      - conf/unbound.conf:/usr/local/etc/unbound/unbound.conf:ro
    behavior: . hint root
  root:
    image: auth
    ref: std:auth
    behavior: |
      . master com NS tld
  tld:
    image: auth
    ref: std:auth
    auto:
      setup: |
        pri = config.get("vars", {}).get("primary", "example.com")
        sec = config.get("vars", {}).get("secondary", "attacker.com")
        origin = config.get("behavior", "")
        origin += f"\n{pri.split('.')[-1]} master {pri.split('.')[-2]} NS primary"
        origin += f"\n{sec.split('.')[-1]} master {sec.split('.')[-2]} NS secondary"
        config["behavior"] = origin
  primary:
    image: auth
    ref: std:auth
    behavior: |
      ${vars.primary} master test A 11.4.15.4
  secondary:
    image: auth
    ref: std:auth
    behavior: |
      ${vars.secondary} master test A 6.6.6.6
  aux:
    image: auth
    ref: std:auth
    build: false

trigger: trigger.${vars.primary}

auto:
  setup:
    - |
      for srv in config.get("builds", {}).keys():
        build = config.get("builds", {}).get(srv, {})
        vars = build.setdefault("vars", {})
        for key, value in config.get("vars", {}).items():
          vars[key] = value
  modify:
    - |
      config.get("builds", {}).get("client", {}).setdefault("environment", {})["T"] = config.get("trigger", "")
    - |
      for srv in config.get("builds", {}).keys():
        config.get("builds", {}).get(srv, {}).pop("vars", None)
      config.pop("vars", None)
      config.pop("trigger", None)
