name: tsuking-chain
inet: 10.66.0.0/24

vars:
  DRS_NUM: 16
  DRS_WIDTH: 1
  UCFG: /usr/local/etc/unbound/unbound.conf

images:
  unbound:
    ref: unbound:1.17.1
  python39:
    ref: python:3.9.0

builds:
  auth:
    image: python39
    volumes:
      - resource/tsuking-server.py:/usr/local/etc/server.py
    command: ["python3", "/usr/local/etc/server.py"]
  victim:
    image: python39
    command: ["python3", "-c", "import time; time.sleep(3600)"]
  traffic:
    image: python39
    command: ["python3", "-c", "import time; print('traffic ready', flush=True); time.sleep(3600)"]
  fl:
    image: unbound
    volumes:
      - resource/weak.conf:${vars.UCFG}
    build: false
  rl:
    image: unbound
    volumes:
      - resource/weak.conf:${vars.UCFG}
    behavior: example.com stub auth
    build: false

auto:
  setup: |
    drs = int(config.get('vars', {}).get('DRS_NUM', 16))
    width = int(config.get('vars', {}).get('DRS_WIDTH', 1))
    for i in range(drs):
      config['builds'][f'fl-{i}'] = {
        'ref': 'fl',
        'behavior': f'. forward {",".join(f"rl-{i}-{j}" for j in range(width))}'
      }
      for j in range(width):
        config['builds'][f'rl-{i}-{j}'] = {'ref': 'rl'}
