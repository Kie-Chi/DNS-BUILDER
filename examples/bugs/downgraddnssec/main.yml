include: resource:/includes/std-auth.yml

name: downgrade
inet: 10.10.10.0/24

vars:
  std:
    dnssec: true

images:
  client:
    ref: python:3.12.0
  bind:
    ref: bind:9.18.4

builds:
  client:
    image: client
    command: tail -f /dev/null
    environment:
      R: ${srv.resolver.ip}
  
  resolver:
    image: mvance/unbound:1.22.0
    ref: std:recursor
    files:
      /usr/local/etc/unbound/dnssec.conf.server: |
        trust-anchor-file: "/usr/local/etc/keys/root.key"
    command: unbound -d -c /usr/local/etc/unbound/unbound.conf
    volumes:
      - key:/:/usr/local/etc/keys
    behavior: |
      . hint root

  root:
    image: bind
    ref: std:auth
    behavior: . master com NS tld

  tld:
    image: bind
    ref: std:auth
    behavior: com master example NS sld

  sld:
    image: bind
    ref: std:auth
    behavior: example.com master www A 1.2.3.4

