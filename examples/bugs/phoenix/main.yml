name: ghost
inet: 10.10.10.0/24

include: resource:/includes/std-auth.yml

images:
  # Base image for the client (Python 3.12)
  client:
    ref: python:3.12.0
    util:
      - scapy
  auth:
    ref: bind:9.18.4
  resolver:
    ref: unbound:1.16.1

builds:
  client:
    image: client
    # Keep the container alive indefinitely
    command: tail -f /dev/null
    volumes:
      - resource/ghost-server.py:/usr/local/bin/ghost.py
    files:
      /usr/local/bin/attack.sh:
        # !/bin/bash
        python3 /usr/local/bin/ghost.py $R example.com --ttl 15 --delay 14
    environment:
      # Inject the IP address of the service named 'resolver'.
      # Usage: `dig @$R example.com`
      R: ${srv.resolver.ip}
      A: ${srv.bad_sld.ip}
      IP: ${ip}

  resolver:
    image: resolver
    ref: std:recursor
    behavior: . hint root

  root:
    image: auth
    ref: std:auth
    behavior: . master com NS tld

  tld:
    image: auth
    ref: std:auth
    behavior: | 
      com master example NS 15 ns.example.com.
      com master ns.example.com. A 15 ${srv.sld.ip}
  sld:
    image: client
    volumes:
      - resource/server.py:/usr/local/bin/server.py
    command: python3 /usr/local/bin/server.py --domain example.com --delay 0.5 --ttl 15 --ip ${ip}
