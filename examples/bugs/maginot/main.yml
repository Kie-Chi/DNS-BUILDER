name: mginot
inet: 10.10.10.0/24

include:
  - resource:/includes/std-auth.yml

images:
  attacker:
    ref: python:3.12.0
  aliyun:
    ref: python:3.12.0
  bind:
    ref: bind:9.18.0
  target:
    ref: python:3.12.0

builds:
  attacker:
    image: attacker
    command: tail -f /dev/null
    environment:
      R: ${srv.br.ip}
      HACK: ${srv.hack.ip}
      IP: ${ip}
  br:
    image: bind
    ref: std:recursor
    behavior: |
      . hint root
      example.com forward target
    auto:
      restrict: |
        from pathlib import Path
        
        # Target the generated contents of the 'resolver' service
        target_path = Path(workdir / "output" / "${proj.name}" / service_name / "contents")
        
        if target_path.exists():
          # Recursively chmod 777
          target_path.chmod(0o777)
          for item in target_path.rglob("*"):
            if item.is_file() or item.is_dir():
              item.chmod(0o777)
        
        result = "PASS"

  root:
    image: bind
    ref: std:auth
    behavior: |
      . master com NS com
  
  com:
    image: bind
    ref: std:auth
    behavior: |
      com master fakefake A hack
      com master a A 1.2.3.4
      com master b A 1.2.3.4
      com master c A 1.2.3.4
      com master d A 1.2.3.4
      com master e A 1.2.3.4
      com master f A 1.2.3.4
      com master g A 1.2.3.4

  example:
    image: bind
    ref: std:auth
    behavior: |
      example.com master www A 1.1.1.1
      example.com master * A 11.4.51.4

  hack:
    image: bind
    ref: std:auth
    behavior: |
      org master www A 1.1.1.1
      org master * A 6.6.6.6

  target:
    image: target
    command: python3 /usr/local/bin/server.py
    auto:
      setup: |
        poison = workdir / "resource" / "maginot-server.py"
        files = config.setdefault("files", {})
        files["/usr/local/bin/server.py"] = fs.read_text(poison).replace(
          "{HACK_IP}", "${srv.hack.ip}"
        ).replace(
          "{ATTACKER_IP}", "${srv.attacker.ip}"
        )

