include: resource:/includes/std-auth.yml

name: badcache
inet: 10.10.10.0/24

vars:
  std:
    dnssec: true

images:
  client:
    ref: python:3.12.0
  bind:
    ref: bind:9.18.4

builds:
  client:
    image: client
    command: tail -f /dev/null
    environment:
      R: ${srv.resolver.ip}
      UR: ${srv.uresolver.ip}

  uresolver:
    image: mvance/unbound:1.22.0
    ref: std:recursor
    files:
      /usr/local/etc/unbound/dnssec.conf.server: |
        trust-anchor-file: "/usr/local/etc/keys/root.key"
    volumes:
      - key:/root.key:/usr/local/etc/keys/root.key
    behavior: |
      . hint root


  resolver:
    image: powerdns/pdns-recursor-52:5.2.2
    ref: std:recursor
    volumes:
      - key:/root.key:/usr/local/etc/keys/root.key
    files:
      /usr/local/etc/dnssec.conf:
        dnssec=validate

        lua-config-file=/usr/local/etc/recursor.lua
      /usr/local/etc/recursor.lua:
        readTrustAnchorsFromFile("/usr/local/etc/keys/root.key", 86400)
    command: --config-dir=/usr/local/etc --enable-old-settings
    behavior: . hint root

  root:
    image: bind
    ref: std:auth
    behavior: . master com NS tld

  tld:
    image: bind
    ref: std:auth
    behavior: | 
      com master vitm-ns NS good-ns
      com master vitm NS ns.vitm-ns.com.

  good-ns:
    image: bind
    ref: std:auth
    behavior: | 
      vitm-ns.com master ns A ${srv.victim.ip}
      vitm-ns.com master www A 1.1.1.1
      vitm-ns.com master badcache A 2.2.2.2

  victim:
    image: bind
    ref: std:auth
    auto:
      modify: |
        config["dnssec"] = False
    behavior: |
      vitm.com master www A 1.1.1.1

