name: tsuname
inet: 10.10.10.0/24

include: resource:/includes/std-auth.yml

images:
  bind:
    ref: "bind:9.18.0"
  root:
    ref: "bind:9.18.0"
  tld:
    ref: "bind:9.18.0"
  sld:
    ref: "bind:9.18.0"
  attacker:
    ref: "python:3.12.0"
  monitor:
    ref: "python:3.12.0"

builds:
  attacker:
    image: "attacker"
    command: "tail -f /dev/null"

  resolver:
    image: "bind"
    ref: "std:recursor"
    behavior: . hint root
  
  root:
    image: "root"
    ref: "std:auth"
    behavior: |
      . master com NS tld
  tld:
    image: "tld"
    ref: "std:auth"
    behavior: |
      com master a NS sld1
  sld1:
    image: "sld"
    ref: "std:auth"
    behavior: |
      a.com master loop1 NS ns.loop2.a.com.
      a.com master loop2 NS ns.loop1.a.com.
auto:
  post:
    - | 
      # patch
      import re
      from pathlib import Path
      for srv in config["builds"].keys():
        if re.match(r"bind.*?$", srv) or srv == "monitor":
          _dir = Path(workdir / "output" / config["name"] / srv / "contents")
          _dir.chmod(0o777)
          for item in _dir.rglob("*"):
            item.chmod(0o777)
      result = "PASS"


