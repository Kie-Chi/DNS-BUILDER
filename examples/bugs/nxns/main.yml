name: nxns
inet: 10.10.66.0/24

images:
  auth:
    ref: bind:9.18.0
  attacker:
    ref: python:3.12.0
  resolver:
    ref: unbound:1.10.0

builds:
  attacker:
    image: attacker
    command: "tail -f /dev/null"
    environment:
      R: ${srv.resolver.ip}
      IP: ${ip}

  resolver:
    image: resolver
    ref: std:recursor
    behavior: |
      example.com stub auth

  auth:
    image: attacker
    volumes:
      - resource/nxns-server.py:/usr/local/bin/server.py
    command: python3 /usr/local/bin/server.py


