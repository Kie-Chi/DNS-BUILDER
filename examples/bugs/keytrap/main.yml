name: keytrap
inet: 10.10.0.0/24

include: resource:/includes/std-auth.yml

vars:
  std:
    dnssec: true

images:
  bind:
    ref: bind:9.16.45
  unbound:
    ref: unbound:1.19.0
  client:
    ref: python:3.12.0

builds:
  client:
    image: client
    environment:
      R: ${srv.resolver.ip}
    volumes:
      - resource/keytrap/query.py:/usr/local/etc/query.py
    command: python /usr/local/etc/query.py
  resolver:
    image: unbound
    ref: std:recursor
    behavior: . hint root
    volumes:
      - key:/root.key:/usr/etc/unbound/keys/root.key
    files:
      /usr/local/etc/unbound/unbound.conf.server: |
        trust-anchor-file: /usr/etc/unbound/keys/root.key

  root:
    image: bind
    ref: std:auth
    behavior: . master com NS tld

  tld:
    image: bind
    ref: std:auth
    behavior: com master example NS sld

  sld:
    image: bind
    ref: std:auth
    dnssec:
      enable: true
      include: resource/keytrap
      hooks:
        pre: |
          # insert fake zsk keys
          from dnsbuilder.io import DNSBPath

          fake = fs.read_text(workdir / "resource" / "keytrap" / "colliding_keys.txt")
          zone_file = DNSBPath(f"temp:/services/{service_name}/zones/{zone.filename}.unsigned")
          fs.write_text(zone_file, fs.read_text(zone_file) + "\n" + fake)
        mid: |
          # insert fake rrsigs

          from dnsbuilder.io import DNSBPath
          zone_file = DNSBPath(f"temp:/services/{service_name}/zones/{zone.filename}")
          ori = fs.read_text(zone_file)
          fake = fs.read_text(workdir / "resource" / "keytrap" / "fake.rrsig")
          target_name = f"www.{zone.fqdn}"
          lines = ori.split('\n')
          new_lines = []
          inserted = False                                                                           
                                                                                                    
          for line in lines:                                                                         
            new_lines.append(line)                                                                   
                                                         
            parts = line.split('\t')                                                                     
            if parts and not parts[0].startswith(';') and not parts[0].startswith('$'):              
              record_name = parts[0]                                                                 
              if record_name == target_name:         
                new_lines.append(fake)                                                               
                inserted = True                                                                      
                                                                                                    
          if not inserted:                                                                           
            new_lines.append(fake)                                                                   
          fs.write_text(zone_file, '\n'.join(new_lines))  
    behavior: |
      example.com master www A 1.2.3.4
      example.com master mail A 1.1.1.1 

auto:
  setup:
    - |
      import subprocess
      scrip_path = (workdir / "resource" / "keytrap" / "start.sh").__path__()
      subprocess.run(["bash", scrip_path])
      
