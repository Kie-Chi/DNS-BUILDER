# KeyTrap case metadata.
# This file follows bridge-sample-CVE-2022-30699.yaml:
# cve, nodes, connections, and poc are the four stable top-level sections.

cve:
  id: CVE-2023-50387
  title: >-
    KeyTrap DNSSEC validation CPU-exhaustion attack against validating
    recursive resolvers
  description: |
    The case reproduces the KeyTrap family of DNSSEC validation attacks.
    CVE-2023-50868 is the related NSEC3 variant. The PoC uses a validating
    Unbound resolver and an authoritative example.com server that supplies
    the crafted DNSKEY/RRSIG material from ./resource/keytrap.

nodes:
  - name: keytrap-resolver
    role: vulnerable-target
    image: dnsb-unbound-1.19.0-768e18c890dc74bd:latest
    os: Ubuntu 22.04
    services:
      - port: 53
        protocol: udp
        purpose: DNS recursive resolver and DNSSEC validation
      - port: 53
        protocol: tcp
        purpose: DNS over TCP
    software:
      - name: unbound
        version: 1.19.0
        purpose: vulnerable-component

  - name: keytrap-client
    role: attacker
    image: dnsb-python-3.12.0-3a0e30dfcf9c3460:latest
    os: Debian-based python:3.12-slim
    services: []
    software:
      - name: python3
        version: 3.12.0
        purpose: query-driver

  - name: keytrap-sld
    role: attacker-infrastructure
    image: dnsb-bind-9.16.45-b0aa0b44d5b8edfa:latest
    os: Ubuntu 18.04
    services:
      - port: 53
        protocol: udp
        purpose: Authoritative example.com DNS with the PoC payload
      - port: 53
        protocol: tcp
        purpose: DNS over TCP
    software:
      - name: bind
        version: 9.16.45
        purpose: authoritative-supporting-service

  - name: keytrap-root
    role: infrastructure-scaffold
    image: dnsb-bind-9.16.45-b0aa0b44d5b8edfa:latest
    os: Ubuntu 18.04
    services:
      - port: 53
        protocol: udp
        purpose: DNS root zone
      - port: 53
        protocol: tcp
        purpose: DNS over TCP
    software:
      - name: bind
        version: 9.16.45
        purpose: supporting-service

  - name: keytrap-tld
    role: infrastructure-scaffold
    image: dnsb-bind-9.16.45-b0aa0b44d5b8edfa:latest
    os: Ubuntu 18.04
    services:
      - port: 53
        protocol: udp
        purpose: com authoritative zone
      - port: 53
        protocol: tcp
        purpose: DNS over TCP
    software:
      - name: bind
        version: 9.16.45
        purpose: supporting-service

  - name: keytrap-net
    role: infrastructure-scaffold
    image: dnsb-bind-9.18.4-e31ec26da5d255a2:latest
    os: Ubuntu 20.04
    services:
      - port: 53
        protocol: udp
        purpose: Generated net authoritative zone
      - port: 53
        protocol: tcp
        purpose: DNS over TCP
    software:
      - name: bind
        version: 9.18.4
        purpose: supporting-service

  - name: keytrap-servers
    role: infrastructure-scaffold
    image: dnsb-bind-9.18.4-e31ec26da5d255a2:latest
    os: Ubuntu 20.04
    services:
      - port: 53
        protocol: udp
        purpose: Generated servers.net service-address zone
      - port: 53
        protocol: tcp
        purpose: DNS over TCP
    software:
      - name: bind
        version: 9.18.4
        purpose: supporting-service

connections:
  - [keytrap-client, keytrap-resolver]
  - [keytrap-resolver, keytrap-root]
  - [keytrap-resolver, keytrap-tld]
  - [keytrap-resolver, keytrap-sld]

poc:
  language: python
  target_node: keytrap-resolver
  target_port: 53
  query_name: www.example.com.
  query_type: A
  description: >-
    The Python client sends an A query for www.example.com. to Unbound.
    Unbound follows the root, com, and example.com delegation chain and
    validates the crafted DNSSEC response returned by keytrap-sld. The
    generated DNSKEY/RRSIG material is prepared by start.sh and the DNSB
    hooks in ./main.yml.
  script_path: ./resource/keytrap/query.py
  config_path: ./main.yml
  resource_path: ./resource/keytrap
