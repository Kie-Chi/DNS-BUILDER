name: rebirthday
inet: 10.10.10.0/24

include:
  - share/client.yml
  - share/auth.yml

images:
  attacker:
    ref: python:3.12.0

builds:
  attacker:
    image: attacker
    command: tail -f /dev/null
    environment:
      R: ${srv.resolver.ip}
      A: ${srv.bad_sld.ip}
      IP: ${ip}

  resolver:
    image: mvance/unbound:1.22.0
    ref: std:recursor
    command: unbound -d -c /usr/local/etc/unbound/unbound.conf
    behavior: |
      . hint root

