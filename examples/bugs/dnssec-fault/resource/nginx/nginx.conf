# nginx bypass config for rec-host. Bind-mounted from resource/nginx/nginx.conf,
# so edits apply on `docker compose restart rec-host`. Runs next to unbound.
worker_processes  1;
error_log  /dev/stderr  info;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log  /dev/stdout;
    sendfile    on;

    server {
        listen       80;
        server_name  _;

        # health/status endpoint
        location = /healthz {
            default_type text/plain;
            return 200 "rec-host nginx bypass: ok\n";
        }

        # --- bypass placeholder: proxy to the local python sidecar once implemented ---
        # location /bypass/ {
        #     proxy_pass http://127.0.0.1:8080/;
        # }
    }
}
